<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; display:flex; justify-items: center; align-items: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    body{background-color: hsl(212, 45%, 89%);}
    main{font-family:'Outfit', sans-serif;
      display: flex;
      min-height: 100vh;
      justify-content: center;
      align-items: center; 
    }
    .card{
      display:flex;
      flex-direction: column;
      width: 18%;
      aspect-ratio: 3:4;
      border-radius: 16px;
      background-color: white;
    }
    img{
      width: 90%;
      align-self:center;
      margin: 18px;
      border-radius: 16px;
    }
    h1{font-weight:700; 
      color: hsl(218, 44%, 22%); 
      text-align: center;
      font-size: 24px;}
    
  </style>
</head>
<body>
  <main>
    <div class = "card">
      <img src = "images/image-qr-code.png" alt="qr code">
      <h1>Improve your front-end skills by building projects</h1>
      <p> Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </div>
  </main>
  
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Davide De Benedetto</a>.
  </footer>
</body>
</html>
