<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; margin-top: 15px;}
    .attribution a { color: hsl(228, 45%, 44%); }
    body{background-color: hsl(212, 45%, 89%);}
    main{font-family:'Outfit', sans-serif;
      display: flex;
      min-height: 100vh;
      justify-content: center;
      align-items: center; 
  
    }
    .card{
      display:flex;
      flex-direction: column;
      align-items: center; 
      height: 465px;
      width:305px;
      border-radius: 18px;
      background-color: white;
      box-shadow: 2px 5px 10px #04040419;
    }
    img{
      width: 270px;
      align-self:center;
      border-radius: 10px;
      margin:15px
    }
    h1{font-weight:700; 
      color: hsl(218, 44%, 22%); 
      text-align: center;
      font-size: 21px;
      margin-top: 2px;
      margin-right: 15px;
      margin-left: 15px;
      }
    
      p{font-weight: 400;
      text-align: center;
      font-size: 15px;
      color: hsl(216, 15%, 48%); 
      margin-top: 2px;
      margin-right: 18px;
      margin-left: 18px;
      margin-bottom: 20px;}
    
  </style>
</head>
<body>
  <main>
    <div class = "card">
      <img src = "images/image-qr-code.png" alt="qr code">
      <h1>Improve your front-end skills by building projects</h1>
      <p> Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </div>
  </main>
  
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/davidedb05/davidedb05.github.io">Davide De Benedetto</a>.
  </footer>
</body>
</html>
